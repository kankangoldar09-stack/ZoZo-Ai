<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ZoZo AI</title>
  <meta name="description" content="ZoZo AI — Premium AI Chat by Jeet Boss" />
  <meta name="theme-color" content="#050508" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
  <style>
    /* ═══════════════════════════════════
       DESIGN SYSTEM
    ═══════════════════════════════════ */
    :root {
      --bg: #050508;
      --bg-2: #0a0a10;
      --bg-3: #0f0f18;
      --bg-4: #151520;
      --bg-glass: rgba(10, 10, 16, 0.85);
      --bg-chip: rgba(255, 255, 255, 0.04);

      --white: #ffffff;
      --t1: #eef0f4;
      --t2: #8b8fa3;
      --t3: #555770;
      --t4: #3a3c50;

      --accent: #7c5cfc;
      --accent2: #c084fc;
      --pink: #f472b6;
      --cyan: #22d3ee;
      --green: #34d399;
      --orange: #fb923c;
      --blue: #60a5fa;

      --grad: linear-gradient(135deg, #7c5cfc, #c084fc, #f472b6);
      --grad2: linear-gradient(135deg, #22d3ee, #7c5cfc, #c084fc);
      --glow: rgba(124, 92, 252, 0.25);

      --border: rgba(255, 255, 255, 0.06);
      --border2: rgba(255, 255, 255, 0.1);

      --r-sm: 12px;
      --r-md: 16px;
      --r-lg: 24px;
      --r-pill: 9999px;

      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    * { -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      background: #000;
      color: var(--t1);
      height: 100dvh; width: 100vw;
      overflow: hidden;
      display: flex; justify-content: center; align-items: center;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* ═══════════════════════════════════
       APP SHELL
    ═══════════════════════════════════ */
    .app {
      width: 100%; height: 100dvh;
      max-width: 430px;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 500px) {
      .app {
        height: 93dvh;
        border-radius: 44px;
        border: 1px solid rgba(255,255,255,0.05);
        box-shadow: 0 30px 80px -20px rgba(0,0,0,0.9), 0 0 120px -30px rgba(124, 92, 252, 0.08);
      }
    }

    /* ═══════════════════════════════════
       AURORA MESH BACKGROUND
    ═══════════════════════════════════ */
    .aurora {
      position: absolute;
      top: -80px; right: -60px;
      width: 320px; height: 320px;
      background: radial-gradient(circle at 30% 40%, rgba(34, 211, 238, 0.12) 0%, transparent 50%),
                  radial-gradient(circle at 70% 30%, rgba(124, 92, 252, 0.18) 0%, transparent 50%),
                  radial-gradient(circle at 50% 60%, rgba(244, 114, 182, 0.1) 0%, transparent 50%);
      filter: blur(50px);
      pointer-events: none; z-index: 0;
      animation: auroraShift 8s ease-in-out infinite alternate;
    }
    .aurora-b {
      position: absolute;
      bottom: -60px; left: -40px;
      width: 260px; height: 200px;
      background: radial-gradient(circle, rgba(124, 92, 252, 0.08) 0%, transparent 60%);
      filter: blur(45px);
      pointer-events: none; z-index: 0;
    }
    @keyframes auroraShift {
      0% { transform: translate(0, 0) scale(1); opacity: 0.7; }
      50% { transform: translate(-10px, 8px) scale(1.08); opacity: 1; }
      100% { transform: translate(5px, -5px) scale(1.04); opacity: 0.85; }
    }

    /* ═══════════════════════════════════
       HEADER
    ═══════════════════════════════════ */
    .hdr {
      position: relative; z-index: 20;
      padding: calc(var(--safe-t) + 8px) 12px 8px;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(5, 5, 8, 0.6);
      backdrop-filter: blur(30px) saturate(1.5);
      -webkit-backdrop-filter: blur(30px) saturate(1.5);
      border-bottom: 1px solid var(--border);
    }
    .hdr-btn {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: transparent; border: none;
      color: var(--t2); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s; flex-shrink: 0;
    }
    .hdr-btn:active { background: rgba(255,255,255,0.05); color: var(--white); transform: scale(0.9); }

    /* Center brand */
    .brand-pill {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 12px 5px 8px;
      border-radius: var(--r-pill);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.2s var(--ease);
    }
    .brand-pill:active { transform: scale(0.95); }
    .brand-pill:hover { border-color: rgba(124,92,252,0.3); }

    .star-4 {
      width: 16px; height: 16px;
      background: var(--grad);
      -webkit-mask: url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 0C12 6.627 6.627 12 0 12c6.627 0 12 5.627 12 12 0-6.627 5.627-12 12-12-6.627 0-12-5.627-12-12z"/></svg>') no-repeat center / contain;
      mask: url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 0C12 6.627 6.627 12 0 12c6.627 0 12 5.627 12 12 0-6.627 5.627-12 12-12-6.627 0-12-5.627-12-12z"/></svg>') no-repeat center / contain;
      flex-shrink: 0;
    }
    .brand-label {
      font-size: 12px; font-weight: 700; color: var(--white);
      letter-spacing: -0.2px;
    }

    /* ═══════════════════════════════════
       CHAT AREA
    ═══════════════════════════════════ */
    .chat {
      flex: 1;
      overflow-y: auto; overflow-x: hidden;
      padding: 20px 16px;
      display: flex; flex-direction: column;
      gap: 16px;
      z-index: 10;
      scroll-behavior: smooth;
      overscroll-behavior: contain;
    }
    .chat::-webkit-scrollbar { width: 0; }

    /* ═══════════════════════════════════
       WELCOME
    ═══════════════════════════════════ */
    .hello {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 0 12px 16px;
      animation: helloIn 0.8s var(--ease);
    }
    @keyframes helloIn {
      from { opacity: 0; transform: translateY(30px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .hello-star {
      width: 64px; height: 64px;
      background: var(--grad);
      -webkit-mask: url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 0C12 6.627 6.627 12 0 12c6.627 0 12 5.627 12 12 0-6.627 5.627-12 12-12-6.627 0-12-5.627-12-12z"/></svg>') no-repeat center / contain;
      mask: url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 0C12 6.627 6.627 12 0 12c6.627 0 12 5.627 12 12 0-6.627 5.627-12 12-12-6.627 0-12-5.627-12-12z"/></svg>') no-repeat center / contain;
      margin-bottom: 24px;
      filter: drop-shadow(0 0 28px var(--glow)) drop-shadow(0 0 56px rgba(192, 132, 252, 0.2));
      animation: floatStar 4s ease-in-out infinite;
    }
    @keyframes floatStar {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(8deg); }
    }

    .hello h1 {
      font-size: 32px; font-weight: 800;
      letter-spacing: -1.2px; line-height: 1.1;
      color: var(--white);
      margin-bottom: 8px;
    }
    .hello h1 span {
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hello .sub {
      font-size: 14px; color: var(--t2);
      line-height: 1.5; max-width: 260px;
      margin-bottom: 32px;
    }

    /* Suggestion chips — vertical */
    .chips {
      display: flex; flex-direction: column;
      gap: 8px; width: 100%;
    }
    .chip {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 16px;
      background: var(--bg-chip);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: all 0.2s var(--ease);
    }
    .chip:active {
      transform: scale(0.98);
      background: rgba(255,255,255,0.06);
      border-color: rgba(124,92,252,0.3);
    }
    .chip-icon {
      width: 32px; height: 32px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .chip-icon.purple { background: rgba(124,92,252,0.12); color: var(--accent); }
    .chip-icon.cyan { background: rgba(34,211,238,0.1); color: var(--cyan); }
    .chip-icon.pink { background: rgba(244,114,182,0.1); color: var(--pink); }
    .chip-icon.orange { background: rgba(251,146,60,0.1); color: var(--orange); }
    .chip-text {
      font-size: 13.5px; font-weight: 500; color: var(--t1);
      flex: 1;
    }
    .chip-arrow { color: var(--t4); flex-shrink: 0; }

    /* ═══════════════════════════════════
       MESSAGES
    ═══════════════════════════════════ */
    .m { display: flex; gap: 10px; max-width: 100%; animation: mIn 0.3s var(--ease); }
    @keyframes mIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .m.u { justify-content: flex-end; }

    /* User bubble */
    .u-bub {
      background: var(--bg-4);
      border: 1px solid var(--border2);
      color: var(--white);
      padding: 10px 16px;
      border-radius: 18px 18px 4px 18px;
      font-size: 14px; line-height: 1.55;
      max-width: 82%;
      user-select: text; word-wrap: break-word;
    }

    /* AI avatar */
    .ai-av {
      width: 22px; height: 22px;
      flex-shrink: 0; margin-top: 2px;
    }
    .ai-w { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }

    /* AI bubble */
    .ai-bub {
      color: var(--t1);
      font-size: 14px; line-height: 1.72;
      user-select: text;
      word-wrap: break-word; overflow-wrap: break-word;
    }
    .ai-bub h1,.ai-bub h2,.ai-bub h3 { font-weight: 700; color: var(--white); margin: 12px 0 5px; }
    .ai-bub h1 { font-size: 17px; } .ai-bub h2 { font-size: 15px; } .ai-bub h3 { font-size: 14px; }
    .ai-bub p { margin-bottom: 8px; } .ai-bub p:last-child { margin-bottom: 0; }
    .ai-bub ul,.ai-bub ol { margin: 6px 0; padding-left: 18px; }
    .ai-bub li { margin-bottom: 3px; }
    .ai-bub strong { color: var(--white); font-weight: 600; }
    .ai-bub a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
    .ai-bub blockquote {
      border-left: 2px solid var(--accent2); padding: 4px 12px;
      margin: 8px 0; color: var(--t2); font-style: italic;
      background: rgba(124,92,252,0.04); border-radius: 0 6px 6px 0;
    }
    .ai-bub code:not(pre code) {
      background: rgba(255,255,255,0.06); padding: 1px 6px;
      border-radius: 4px; font-family: 'JetBrains Mono',monospace;
      font-size: 12px; color: var(--accent2);
    }
    .ai-bub pre {
      margin: 8px 0; background: #000 !important;
      border: 1px solid var(--border); border-radius: 10px;
      overflow: hidden; position: relative;
    }
    .ai-bub pre code {
      display: block; padding: 12px 14px;
      font-family: 'JetBrains Mono',monospace;
      font-size: 11.5px; line-height: 1.6;
      color: #d4d4d8; overflow-x: auto;
      background: transparent !important;
    }
    .cc-btn {
      position: absolute; top: 5px; right: 5px;
      background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      border-radius: 6px; color: var(--t3);
      padding: 3px 7px; font-size: 10px;
      font-family: 'JetBrains Mono',monospace;
      cursor: pointer; display: flex; align-items: center; gap: 3px;
      transition: all 0.12s; z-index: 5;
    }
    .cc-btn:hover { background: rgba(255,255,255,0.1); color: var(--white); }

    /* Actions */
    .acts { display: flex; gap: 12px; padding-top: 2px; }
    .ab {
      background: none; border: none; color: var(--t4); cursor: pointer;
      display: flex; align-items: center; gap: 4px;
      font-size: 11px; font-family: inherit; transition: color 0.12s; padding: 3px 0;
    }
    .ab:active,.ab:hover { color: var(--t1); }

    /* Loader */
    .ldr { display: inline-flex; gap: 4px; padding: 4px 0; }
    .ld {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--grad);
      animation: ldPop 1.4s ease-in-out infinite both;
    }
    .ld:nth-child(2) { animation-delay: 0.15s; }
    .ld:nth-child(3) { animation-delay: 0.3s; }
    @keyframes ldPop {
      0%,80%,100% { transform: scale(0.3); opacity: 0.2; }
      40% { transform: scale(1); opacity: 1; }
    }
    .typing::after {
      content: '▊'; animation: cblink 1s steps(2,start) infinite;
      color: var(--accent); margin-left: 1px;
    }
    @keyframes cblink { to { visibility: hidden; } }

    /* ═══════════════════════════════════
       COMPOSER
    ═══════════════════════════════════ */
    .comp {
      padding: 6px 10px calc(var(--safe-b) + 8px);
      background: linear-gradient(to top, var(--bg) 85%, transparent);
      z-index: 20;
    }
    .comp-bar {
      background: var(--bg-3);
      border: 1px solid var(--border2);
      border-radius: 26px;
      padding: 4px 5px 4px 5px;
      display: flex; align-items: flex-end; gap: 2px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .comp-bar:focus-within {
      border-color: rgba(124,92,252,0.4);
      box-shadow: 0 0 18px rgba(124,92,252,0.1), 0 4px 24px rgba(0,0,0,0.4);
    }
    .cb {
      width: 32px; height: 32px; border-radius: 50%;
      background: transparent; border: none;
      color: var(--t3); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.12s; flex-shrink: 0;
    }
    .cb:active { color: var(--t1); transform: scale(0.88); }
    .c-ta {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--t1); font-family: inherit;
      font-size: 14px; line-height: 20px;
      max-height: 100px; min-height: 20px;
      resize: none; padding: 6px 6px;
      user-select: text;
    }
    .c-ta::placeholder { color: var(--t4); }
    .snd {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--grad); border: none; color: var(--white);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      transition: all 0.2s var(--ease);
      box-shadow: 0 2px 12px rgba(124,92,252,0.3);
    }
    .snd:disabled { background: var(--bg-4); color: var(--t4); cursor: default; box-shadow: none; }
    .snd:not(:disabled):active { transform: scale(0.85); }

    /* ═══════════════════════════════════
       DRAWER
    ═══════════════════════════════════ */
    .d-bg {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      z-index: 50; opacity: 0; pointer-events: none;
      transition: opacity 0.3s var(--ease);
    }
    .d-bg.on { opacity: 1; pointer-events: auto; }
    .drw {
      position: absolute; top: 0; left: 0; bottom: 0;
      width: 80%; max-width: 300px;
      background: var(--bg-2);
      border-right: 1px solid var(--border);
      z-index: 55;
      transform: translateX(-100%);
      transition: transform 0.35s var(--ease);
      display: flex; flex-direction: column;
      padding: calc(var(--safe-t) + 12px) 12px calc(var(--safe-b) + 12px);
    }
    .drw.on { transform: translateX(0); }
    .drw-top {
      display: flex; justify-content: space-between; align-items: center;
      padding: 2px 2px 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .drw-logo { display: flex; align-items: center; gap: 7px; }
    .drw-logo .star-4 { width: 20px; height: 20px; }
    .drw-logo span { font-weight: 800; font-size: 16px; color: var(--white); }
    .nc-btn {
      width: 100%; padding: 10px 12px;
      border-radius: 10px;
      background: rgba(124,92,252,0.08);
      border: 1px solid rgba(124,92,252,0.15);
      color: #c4b5fd;
      display: flex; align-items: center; gap: 7px;
      font-weight: 600; font-size: 13px; font-family: inherit;
      cursor: pointer; margin-bottom: 14px;
      transition: all 0.15s;
    }
    .nc-btn:active { transform: scale(0.97); background: rgba(124,92,252,0.14); }
    .dl { font-size: 9px; font-weight: 700; color: var(--t4); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 5px; padding-left: 4px; }
    .tl { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; }
    .tl::-webkit-scrollbar { width: 0; }
    .ti {
      display: flex; align-items: center; gap: 7px;
      padding: 8px 8px; font-size: 13px; color: var(--t2);
      border-radius: 8px; cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.12s;
    }
    .ti:hover { background: rgba(255,255,255,0.03); color: var(--t1); }
    .ti.on { background: rgba(124,92,252,0.08); border-color: rgba(124,92,252,0.2); color: var(--white); }
    .ti .tt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ti .td {
      background: none; border: none; color: var(--t4); cursor: pointer;
      padding: 2px; border-radius: 4px; display: flex; align-items: center;
      opacity: 0; transition: all 0.1s;
    }
    .ti:hover .td { opacity: 1; }
    .ti .td:hover { color: #f87171; }
    .drw-ft {
      border-top: 1px solid var(--border); padding-top: 8px;
      display: flex; flex-direction: column; gap: 1px;
    }
    .df {
      display: flex; align-items: center; gap: 7px;
      padding: 8px 8px; font-size: 12.5px; color: var(--t3);
      cursor: pointer; border-radius: 8px;
      border: none; background: none; font-family: inherit; width: 100%;
      transition: all 0.1s;
    }
    .df:hover { background: rgba(255,255,255,0.03); color: var(--t1); }

    /* ═══════════════════════════════════
       SETTINGS MODAL
    ═══════════════════════════════════ */
    .so {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      z-index: 80;
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s var(--ease);
    }
    .so.on { opacity: 1; pointer-events: auto; }
    .sp {
      width: 100%; max-width: 330px;
      background: var(--bg-2); border: 1px solid var(--border2);
      border-radius: 20px; padding: 20px;
      display: flex; flex-direction: column; gap: 14px;
      transform: scale(0.92) translateY(12px);
      transition: transform 0.3s var(--ease);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .so.on .sp { transform: scale(1) translateY(0); }
    .sh { display: flex; align-items: center; justify-content: space-between; }
    .sh h3 { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .sf { display: flex; flex-direction: column; gap: 4px; }
    .sl { font-size: 9px; font-weight: 700; color: var(--t4); text-transform: uppercase; letter-spacing: 0.5px; }
    .si {
      width: 100%; background: rgba(255,255,255,0.03);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 11px; outline: none;
      color: var(--t1); font-family: inherit; font-size: 13px;
      transition: border 0.15s;
    }
    .si:focus { border-color: rgba(124,92,252,0.4); }
    .ss {
      width: 100%; background: var(--bg-3);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 11px; outline: none;
      color: var(--t1); font-family: inherit; font-size: 13px;
      -webkit-appearance: none;
    }
    .ss:focus { border-color: rgba(124,92,252,0.4); }
    .sta {
      width: 100%; background: rgba(255,255,255,0.03);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 11px; outline: none;
      color: var(--t1); font-family: inherit; font-size: 13px;
      resize: none; min-height: 50px; line-height: 1.4;
    }
    .sta:focus { border-color: rgba(124,92,252,0.4); }
    .rr { display: flex; justify-content: space-between; align-items: center; }
    .rv { font-family: 'JetBrains Mono',monospace; font-size: 11px; color: var(--accent2); font-weight: 600; }
    input[type="range"] { width: 100%; accent-color: var(--accent); margin-top: 2px; }
    .sbs { display: flex; gap: 8px; padding-top: 2px; }
    .s-can {
      flex: 1; padding: 8px; border-radius: 8px;
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      color: var(--t2); font-weight: 600; font-size: 12px;
      cursor: pointer; font-family: inherit; transition: all 0.1s;
    }
    .s-can:hover { background: rgba(255,255,255,0.06); color: var(--white); }
    .s-sav {
      flex: 1; padding: 8px; border-radius: 8px;
      background: var(--grad); border: none;
      color: var(--white); font-weight: 700; font-size: 12px;
      cursor: pointer; font-family: inherit; transition: all 0.12s;
      box-shadow: 0 2px 10px rgba(124,92,252,0.25);
    }
    .s-sav:active { transform: scale(0.96); }

    /* ═══════════════════════════════════
       KEY WALL
    ═══════════════════════════════════ */
    .kw {
      position: absolute; inset: 0;
      background: rgba(5,5,8,0.95);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      z-index: 35;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s;
    }
    .kw.on { opacity: 1; pointer-events: auto; }
    .kb {
      background: var(--bg-2); border: 1px solid var(--border2);
      border-radius: 20px; padding: 28px 22px;
      max-width: 310px; width: 100%;
      text-align: center;
      display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .k-ico {
      width: 46px; height: 46px; border-radius: var(--r-sm);
      background: rgba(251,191,36,0.07); border: 1px solid rgba(251,191,36,0.15);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto; color: #fbbf24;
    }
    .kb h3 { font-size: 16px; font-weight: 700; }
    .kb p { font-size: 13px; color: var(--t2); line-height: 1.4; }
    .ki {
      width: 100%; background: rgba(255,255,255,0.03);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 14px; outline: none;
      color: var(--t1); font-family: inherit; font-size: 14px;
      text-align: center;
    }
    .ki:focus { border-color: rgba(124,92,252,0.35); }
    .k-btn {
      width: 100%; padding: 11px; border-radius: 10px;
      background: var(--grad); border: none;
      color: var(--white); font-weight: 700; font-size: 14px;
      cursor: pointer; font-family: inherit;
      box-shadow: 0 3px 14px rgba(124,92,252,0.25);
      transition: all 0.12s;
    }
    .k-btn:active { transform: scale(0.97); }

    /* ═══════════════════════════════════
       VOICE
    ═══════════════════════════════════ */
    #voice {
      position: absolute; inset: 0;
      background: var(--bg); z-index: 70;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: calc(var(--safe-t) + 14px) 20px calc(var(--safe-b) + 20px);
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
    }
    #voice.on { opacity: 1; pointer-events: auto; }
    .vt { display: flex; justify-content: space-between; align-items: center; }
    .vl { font-size: 13px; font-weight: 600; color: var(--t3); }
    .vorb {
      width: 120px; height: 120px; border-radius: 50%;
      background: var(--grad);
      box-shadow: 0 0 50px var(--glow), 0 0 100px rgba(192,132,252,0.12);
      animation: orbSpin 5s infinite linear; margin: auto;
    }
    @keyframes orbSpin {
      0% { transform: scale(1) rotate(0); filter: hue-rotate(0); }
      50% { transform: scale(1.12) rotate(180deg); filter: hue-rotate(40deg); }
      100% { transform: scale(1) rotate(360deg); filter: hue-rotate(0); }
    }
    .vb { display: flex; justify-content: center; gap: 24px; }
    .vbn {
      width: 50px; height: 50px; border-radius: 50%;
      border: none; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.12s;
    }
    .vbn:active { transform: scale(0.88); }
    .vm { background: var(--bg-3); border: 1px solid var(--border) !important; color: var(--t2); }
    .ve { background: #ef4444; color: var(--white); }

    /* Toast */
    .tst {
      position: absolute; bottom: 80px; left: 50%;
      transform: translateX(-50%) translateY(14px);
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2);
      color: #f87171; padding: 8px 14px; border-radius: 10px;
      font-size: 12px; z-index: 40; backdrop-filter: blur(8px);
      opacity: 0; pointer-events: none;
      transition: all 0.25s var(--ease);
      max-width: 85%; text-align: center;
    }
    .tst.on { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  </style>
</head>
<body>

<div class="app">
  <div class="aurora"></div>
  <div class="aurora-b"></div>

  <!-- HEADER -->
  <header class="hdr">
    <button class="hdr-btn" id="menuBtn"><i data-lucide="menu" size="18"></i></button>
    <div class="brand-pill" id="modelPill">
      <div class="star-4"></div>
      <span class="brand-label" id="mName">Gemini 2.5 Flash</span>
      <i data-lucide="chevron-down" size="12" style="color:var(--t3)"></i>
    </div>
    <button class="hdr-btn" id="ncBtn"><i data-lucide="square-pen" size="18"></i></button>
  </header>

  <!-- CHAT -->
  <main class="chat" id="chat">
    <div class="hello" id="hello">
      <div class="hello-star"></div>
      <h1>Hey, <span>Jeet</span> ✨</h1>
      <p class="sub">What would you like to explore today?</p>
      <div class="chips">
        <div class="chip" onclick="qk('Code a responsive navbar in HTML/CSS')">
          <div class="chip-icon purple"><i data-lucide="code-2" size="16"></i></div>
          <span class="chip-text">Code a responsive navbar</span>
          <i data-lucide="arrow-right" size="14" class="chip-arrow"></i>
        </div>
        <div class="chip" onclick="qk('Explain asynchronous JavaScript and Event Loop')">
          <div class="chip-icon cyan"><i data-lucide="zap" size="16"></i></div>
          <span class="chip-text">Explain JS Event Loop</span>
          <i data-lucide="arrow-right" size="14" class="chip-arrow"></i>
        </div>
        <div class="chip" onclick="qk('Write a high-converting landing page copy')">
          <div class="chip-icon pink"><i data-lucide="feather" size="16"></i></div>
          <span class="chip-text">Write landing page copy</span>
          <i data-lucide="arrow-right" size="14" class="chip-arrow"></i>
        </div>
        <div class="chip" onclick="qk('Brainstorm 3 creative game mechanics')">
          <div class="chip-icon orange"><i data-lucide="gamepad-2" size="16"></i></div>
          <span class="chip-text">Brainstorm game ideas</span>
          <i data-lucide="arrow-right" size="14" class="chip-arrow"></i>
        </div>
      </div>
    </div>
  </main>

  <!-- COMPOSER -->
  <footer class="comp">
    <div class="comp-bar">
      <button class="cb" title="Attach"><i data-lucide="camera" size="17"></i></button>
      <textarea id="inp" class="c-ta" placeholder="Message ZoZo AI..." rows="1"></textarea>
      <button class="cb" id="micBtn" title="Voice"><i data-lucide="mic" size="17"></i></button>
      <button class="snd" id="sndBtn" disabled><i data-lucide="arrow-up" size="17"></i></button>
    </div>
  </footer>

  <!-- DRAWER -->
  <div class="d-bg" id="dBg"></div>
  <aside class="drw" id="drw">
    <div class="drw-top">
      <div class="drw-logo"><div class="star-4"></div><span>ZoZo AI</span></div>
      <button class="hdr-btn" id="xDrw"><i data-lucide="x" size="16"></i></button>
    </div>
    <button class="nc-btn" onclick="newChat()"><i data-lucide="plus" size="15"></i> New Chat</button>
    <span class="dl">Recent</span>
    <div class="tl" id="tl"></div>
    <div class="drw-ft">
      <button class="df" onclick="clearAll()"><i data-lucide="trash-2" size="14"></i> Clear All</button>
      <button class="df" onclick="openS()"><i data-lucide="settings" size="14"></i> Settings</button>
    </div>
  </aside>

  <!-- SETTINGS -->
  <div class="so" id="so">
    <div class="sp">
      <div class="sh">
        <h3><i data-lucide="sliders" size="14" style="color:var(--accent2)"></i> Settings</h3>
        <button class="hdr-btn" id="xS" style="width:28px;height:28px"><i data-lucide="x" size="14"></i></button>
      </div>
      <div class="sf"><label class="sl">API Key</label><input type="password" id="sK" class="si" placeholder="Gemini API key..."></div>
      <div class="sf"><label class="sl">Model</label>
        <select id="sM" class="ss">
          <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
          <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
          <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
          <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
          <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
        </select>
      </div>
      <div class="sf"><label class="sl">System Prompt</label><textarea id="sSy" class="sta" rows="2" placeholder="Instructions..."></textarea></div>
      <div class="sf">
        <div class="rr"><label class="sl">Temperature</label><span class="rv" id="tV">0.7</span></div>
        <input type="range" id="sT" min="0" max="2" step="0.1" value="0.7">
      </div>
      <div class="sbs"><button class="s-can" onclick="xS()">Cancel</button><button class="s-sav" onclick="saveS()">Save</button></div>
    </div>
  </div>

  <!-- KEY WALL -->
  <div class="kw" id="kw">
    <div class="kb">
      <div class="k-ico"><i data-lucide="key" size="20"></i></div>
      <h3>API Key Required</h3>
      <p>Enter your Gemini API key to start.</p>
      <input type="password" id="kI" class="ki" placeholder="Paste API key...">
      <button class="k-btn" onclick="saveKey()">Connect</button>
    </div>
  </div>

  <!-- VOICE -->
  <div id="voice">
    <div class="vt">
      <button class="hdr-btn" id="xV"><i data-lucide="chevron-down" size="20"></i></button>
      <span class="vl">ZoZo Live</span>
      <div style="width:36px"></div>
    </div>
    <div class="vorb"></div>
    <div class="vb">
      <button class="vbn vm"><i data-lucide="mic-off" size="18"></i></button>
      <button class="vbn ve" id="eV"><i data-lucide="phone-off" size="18"></i></button>
    </div>
  </div>

  <div class="tst" id="tst"></div>
</div>

<script>
let C={apiKey:'',model:'gemini-2.5-flash',sys:'Aapka naam ZoZo AI hai — sabse BEST AI companion! Hinglish mein respond karo. Creator: Jeet Boss.',temp:0.7};
let T=[],aid=null,busy=false;
const M={'gemini-2.5-flash':'Gemini 2.5 Flash','gemini-2.5-pro':'Gemini 2.5 Pro','gemini-2.0-flash':'Gemini 2.0 Flash','gemini-1.5-flash':'Gemini 1.5 Flash','gemini-1.5-pro':'Gemini 1.5 Pro'};
const $=id=>document.getElementById(id),chat=$('chat'),hello=$('hello'),inp=$('inp'),sndBtn=$('sndBtn');

window.addEventListener('DOMContentLoaded',()=>{ldC();ldT();syncK();lucide.createIcons()});

function ldC(){const s=localStorage.getItem('zc');if(s)try{C={...C,...JSON.parse(s)}}catch(e){}$('sK').value=C.apiKey;$('sM').value=C.model;$('sSy').value=C.sys;$('sT').value=C.temp;$('tV').textContent=C.temp;$('mName').textContent=M[C.model]||'Gemini AI'}
function svC(){localStorage.setItem('zc',JSON.stringify(C));syncK();$('mName').textContent=M[C.model]||'Gemini AI'}
function syncK(){const ok=C.apiKey&&C.apiKey.trim();$('kw').classList.toggle('on',!ok);sndBtn.disabled=busy||!ok||!inp.value.trim()}
function saveKey(){const k=$('kI').value.trim();if(!k)return;C.apiKey=k;$('sK').value=k;svC()}

function ldT(){const s=localStorage.getItem('zt');if(s)try{T=JSON.parse(s)}catch(e){}if(!T.length)newChat();else{aid=T[0].id;rT();rC()}}
function svT(){localStorage.setItem('zt',JSON.stringify(T))}
function newChat(){const id='t'+Date.now();T.unshift({id,title:'New Chat',messages:[]});aid=id;svT();rT();rC();hD();setTimeout(()=>inp.focus(),80)}
function sw(id){if(aid===id||busy)return;aid=id;rT();rC();hD()}
function del(id,e){e.stopPropagation();T=T.filter(t=>t.id!==id);if(aid===id)aid=T.length?T[0].id:null;if(!T.length)newChat();else{svT();rT();rC()}}
function clearAll(){T=[];aid=null;svT();newChat()}
function rT(){const el=$('tl');el.innerHTML='';T.forEach(t=>{const d=document.createElement('div');d.className='ti'+(t.id===aid?' on':'');d.onclick=()=>sw(t.id);d.innerHTML=`<i data-lucide="message-square" size="13" style="flex-shrink:0;color:${t.id===aid?'var(--accent)':'var(--t4)'}"></i><span class="tt">${esc(t.title)}</span><button class="td" onclick="del('${t.id}',event)"><i data-lucide="trash-2" size="11"></i></button>`;el.appendChild(d)});lucide.createIcons()}

function rC(){const t=T.find(x=>x.id===aid);chat.querySelectorAll('.m').forEach(e=>e.remove());if(!t||!t.messages.length){hello.style.display='flex';return}hello.style.display='none';t.messages.forEach(m=>m.role==='user'?addU(m.text,false):addA(m.text,false));sc()}
function addU(t,a=true){const d=document.createElement('div');d.className='m u';if(!a)d.style.animation='none';d.innerHTML=`<div class="u-bub">${esc(t)}</div>`;chat.appendChild(d)}
function addA(md,a=true){const d=document.createElement('div');d.className='m';if(!a)d.style.animation='none';d.innerHTML=`<div class="star-4 ai-av"></div><div class="ai-w"><div class="ai-bub">${marked.parse(md)}</div><div class="acts"><button class="ab" onclick="cpM(this)"><i data-lucide="copy" size="11"></i> Copy</button><button class="ab" onclick="retry()"><i data-lucide="rotate-cw" size="11"></i> Retry</button><button class="ab"><i data-lucide="thumbs-up" size="11"></i></button><button class="ab"><i data-lucide="share-2" size="11"></i></button></div></div>`;chat.appendChild(d);const b=d.querySelector('.ai-bub');Prism.highlightAllUnder(b);ccB(b);lucide.createIcons()}
function ccB(el){el.querySelectorAll('pre').forEach(p=>{if(p.querySelector('.cc-btn'))return;p.style.position='relative';const b=document.createElement('button');b.className='cc-btn';b.innerHTML=`<i data-lucide="copy" size="9"></i> Copy`;b.onclick=()=>{const c=p.querySelector('code');if(c){navigator.clipboard.writeText(c.innerText);b.innerHTML=`<i data-lucide="check" size="9"></i> Done`;lucide.createIcons();setTimeout(()=>{b.innerHTML=`<i data-lucide="copy" size="9"></i> Copy`;lucide.createIcons()},1500)}};p.appendChild(b)});lucide.createIcons()}

inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,100)+'px';syncK()});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go()}});
sndBtn.addEventListener('click',go);
function go(){const v=inp.value.trim();if(v&&!sndBtn.disabled)send(v)}
function qk(t){if(!C.apiKey||!C.apiKey.trim()){$('kw').classList.add('on');return}send(t)}

async function send(text){
  if(busy)return;if(!C.apiKey||!C.apiKey.trim()){$('kw').classList.add('on');return}
  const t=T.find(x=>x.id===aid);if(!t)return;
  hello.style.display='none';addU(text);inp.value='';inp.style.height='auto';sndBtn.disabled=true;busy=true;
  t.messages.push({role:'user',text});
  if(t.title==='New Chat'){t.title=text.length>24?text.slice(0,21)+'...':text;rT()}
  svT();sc();
  const ld=document.createElement('div');ld.className='m';ld.innerHTML=`<div class="star-4 ai-av"></div><div class="ldr"><div class="ld"></div><div class="ld"></div><div class="ld"></div></div>`;chat.appendChild(ld);sc();
  try{
    const contents=t.messages.map(m=>({role:m.role==='user'?'user':'model',parts:[{text:m.text}]}));
    const body={contents,generationConfig:{temperature:+C.temp}};
    if(C.sys&&C.sys.trim())body.systemInstruction={parts:[{text:C.sys}]};
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${C.model}:streamGenerateContent?key=${C.apiKey}&alt=sse`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error?.message||`HTTP ${res.status}`)}
    ld.remove();
    const sr=document.createElement('div');sr.className='m';sr.innerHTML=`<div class="star-4 ai-av"></div><div class="ai-w"><div class="ai-bub typing" id="stm"></div></div>`;chat.appendChild(sr);sc();
    const dest=$('stm');let acc='',buf='';const rd=res.body.getReader(),dc=new TextDecoder();
    while(true){const{done,value}=await rd.read();if(done)break;buf+=dc.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();for(const l of ls){const tr=l.trim();if(tr.startsWith('data: ')){try{const p=JSON.parse(tr.slice(6));const ch=p.candidates?.[0]?.content?.parts?.[0]?.text||'';if(ch){acc+=ch;dest.innerHTML=marked.parse(acc);Prism.highlightAllUnder(dest);sc()}}catch(e){}}}}
    dest.classList.remove('typing');dest.removeAttribute('id');
    const ac=document.createElement('div');ac.className='acts';ac.innerHTML=`<button class="ab" onclick="cpM(this)"><i data-lucide="copy" size="11"></i> Copy</button><button class="ab" onclick="retry()"><i data-lucide="rotate-cw" size="11"></i> Retry</button><button class="ab"><i data-lucide="thumbs-up" size="11"></i></button><button class="ab"><i data-lucide="share-2" size="11"></i></button>`;
    sr.querySelector('.ai-w').appendChild(ac);ccB(dest);lucide.createIcons();
    t.messages.push({role:'model',text:acc});svT();
  }catch(err){ld.remove();toast(err.message);console.error(err)}finally{busy=false;syncK()}
}
function retry(){const t=T.find(x=>x.id===aid);if(!t||t.messages.length<2||busy)return;if(t.messages.at(-1).role==='model')t.messages.pop();const l=t.messages.at(-1);if(l?.role==='user'){t.messages.pop();svT();rC();send(l.text)}}

function sc(){chat.scrollTop=chat.scrollHeight}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cpM(b){const t=b.closest('.ai-w').querySelector('.ai-bub').innerText;navigator.clipboard.writeText(t);b.innerHTML=`<i data-lucide="check" size="11"></i> Copied`;lucide.createIcons();setTimeout(()=>{b.innerHTML=`<i data-lucide="copy" size="11"></i> Copy`;lucide.createIcons()},1500)}
function toast(m){const t=$('tst');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),3000)}

function sD(){$('dBg').classList.add('on');$('drw').classList.add('on')}
function hD(){$('dBg').classList.remove('on');$('drw').classList.remove('on')}
$('menuBtn').onclick=sD;$('xDrw').onclick=hD;$('dBg').onclick=hD;$('ncBtn').onclick=newChat;

function openS(){hD();$('sK').value=C.apiKey;$('sM').value=C.model;$('sSy').value=C.sys;$('sT').value=C.temp;$('tV').textContent=C.temp;$('so').classList.add('on')}
function xS(){$('so').classList.remove('on')}
$('xS').onclick=xS;$('so').addEventListener('click',e=>{if(e.target===$('so'))xS()});
$('sT').addEventListener('input',function(){$('tV').textContent=this.value});
function saveS(){C.apiKey=$('sK').value.trim();C.model=$('sM').value;C.sys=$('sSy').value.trim();C.temp=+$('sT').value;svC();xS()}

$('micBtn').onclick=()=>$('voice').classList.add('on');
$('xV').onclick=()=>$('voice').classList.remove('on');
$('eV').onclick=()=>$('voice').classList.remove('on');

const mk=Object.keys(M);
$('modelPill').onclick=()=>{let i=mk.indexOf(C.model);i=(i+1)%mk.length;C.model=mk[i];$('mName').textContent=M[C.model];$('sM').value=C.model;svC()};

lucide.createIcons();
</script>
</body>
</html>
