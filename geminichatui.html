<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ZoZo AI — Premium Chat</title>
  <meta name="description" content="Premium mobile AI chat powered by ZoZo AI — built by Jeet Boss." />
  <meta name="theme-color" content="#07080b" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
  <style>
    /* ═══════════════════════════════════════
       DESIGN TOKENS
    ═══════════════════════════════════════ */
    :root {
      --bg-primary: #05060a;
      --bg-card: #0c0e14;
      --bg-elevated: #12141c;
      --bg-glass: rgba(12, 14, 20, 0.92);
      --bg-glass-light: rgba(255,255,255,0.03);

      --accent-1: #6366f1;
      --accent-2: #a855f7;
      --accent-3: #ec4899;
      --accent-4: #3b82f6;
      --gradient-main: linear-gradient(135deg, #6366f1 0%, #a855f7 35%, #ec4899 70%, #f43f5e 100%);
      --gradient-subtle: linear-gradient(135deg, rgba(99,102,241,0.15) 0%, rgba(168,85,247,0.08) 100%);
      --glow-color: rgba(139, 92, 246, 0.3);

      --border-dim: rgba(255,255,255,0.06);
      --border-med: rgba(255,255,255,0.1);
      --border-lit: rgba(255,255,255,0.16);

      --text-1: #f1f5f9;
      --text-2: #94a3b8;
      --text-3: #64748b;
      --text-4: #475569;

      --r-xs: 8px;
      --r-sm: 12px;
      --r-md: 16px;
      --r-lg: 22px;
      --r-xl: 28px;
      --r-full: 9999px;

      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --spring: cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ═══════════════════════════════════════
       RESET
    ═══════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    * { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: #000;
      color: var(--text-1);
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* ═══════════════════════════════════════
       APP SHELL
    ═══════════════════════════════════════ */
    #phone {
      width: 100%;
      height: 100dvh;
      max-width: 430px;
      background: var(--bg-primary);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 500px) {
      #phone {
        height: 92dvh;
        border-radius: 40px;
        border: 1px solid var(--border-dim);
        box-shadow:
          0 0 0 1px rgba(255,255,255,0.04),
          0 25px 60px -12px rgba(0,0,0,0.8),
          0 0 100px -20px rgba(139, 92, 246, 0.15);
      }
    }

    /* ═══════════════════════════════════════
       AMBIENT EFFECTS
    ═══════════════════════════════════════ */
    .glow-top {
      position: absolute;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 360px;
      height: 260px;
      background: radial-gradient(ellipse at center, rgba(139, 92, 246, 0.25) 0%, rgba(236, 72, 153, 0.08) 40%, transparent 70%);
      filter: blur(60px);
      pointer-events: none;
      z-index: 1;
      animation: glowBreath 5s ease-in-out infinite alternate;
    }
    .glow-bottom {
      position: absolute;
      bottom: -80px;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 160px;
      background: radial-gradient(ellipse, rgba(99, 102, 241, 0.12) 0%, transparent 70%);
      filter: blur(50px);
      pointer-events: none;
      z-index: 1;
    }
    @keyframes glowBreath {
      0% { opacity: 0.6; transform: translateX(-50%) scale(1); }
      100% { opacity: 1; transform: translateX(-50%) scale(1.15); }
    }

    /* ═══════════════════════════════════════
       HEADER
    ═══════════════════════════════════════ */
    .header {
      position: relative;
      z-index: 20;
      padding: calc(var(--safe-t) + 10px) 14px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-glass);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border-bottom: 1px solid var(--border-dim);
    }
    .h-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--r-sm);
      background: transparent;
      border: none;
      color: var(--text-2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s var(--spring);
      flex-shrink: 0;
    }
    .h-btn:active { background: var(--bg-elevated); color: var(--text-1); transform: scale(0.92); }

    /* Model pill */
    .model-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px 6px 10px;
      border-radius: var(--r-full);
      background: var(--bg-glass-light);
      border: 1px solid var(--border-dim);
      cursor: pointer;
      transition: all 0.25s var(--spring);
    }
    .model-pill:active { transform: scale(0.95); }
    .model-pill:hover { border-color: rgba(139, 92, 246, 0.4); box-shadow: 0 0 16px rgba(139, 92, 246, 0.12); }
    .star-icon {
      width: 18px; height: 18px;
      background: var(--gradient-main);
      -webkit-mask: url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 0C12 6.627 6.627 12 0 12c6.627 0 12 5.627 12 12 0-6.627 5.627-12 12-12-6.627 0-12-5.627-12-12z"/></svg>') no-repeat center / contain;
      mask: url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 0C12 6.627 6.627 12 0 12c6.627 0 12 5.627 12 12 0-6.627 5.627-12 12-12-6.627 0-12-5.627-12-12z"/></svg>') no-repeat center / contain;
      flex-shrink: 0;
    }
    .model-name { font-size: 12.5px; font-weight: 700; color: #fff; white-space: nowrap; letter-spacing: -0.2px; }

    /* ═══════════════════════════════════════
       CHAT VIEWPORT
    ═══════════════════════════════════════ */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 10;
      scroll-behavior: smooth;
      overscroll-behavior: contain;
    }
    .chat-area::-webkit-scrollbar { width: 3px; }
    .chat-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.05); border-radius: 99px; }

    /* ═══════════════════════════════════════
       WELCOME SCREEN
    ═══════════════════════════════════════ */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex: 1;
      padding: 20px 8px 10px;
      animation: welcomeUp 0.7s var(--spring);
    }
    @keyframes welcomeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .welcome-star {
      width: 56px; height: 56px;
      background: var(--gradient-main);
      -webkit-mask: url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 0C12 6.627 6.627 12 0 12c6.627 0 12 5.627 12 12 0-6.627 5.627-12 12-12-6.627 0-12-5.627-12-12z"/></svg>') no-repeat center / contain;
      mask: url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 0C12 6.627 6.627 12 0 12c6.627 0 12 5.627 12 12 0-6.627 5.627-12 12-12-6.627 0-12-5.627-12-12z"/></svg>') no-repeat center / contain;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 22px rgba(139, 92, 246, 0.65));
      animation: starPulse 3.5s ease-in-out infinite alternate;
    }
    @keyframes starPulse {
      0% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 22px rgba(139, 92, 246, 0.65)); }
      100% { transform: scale(1.1) rotate(10deg); filter: drop-shadow(0 0 30px rgba(236, 72, 153, 0.6)); }
    }

    .welcome h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1.15;
      background: var(--gradient-main);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }
    .welcome p {
      font-size: 13.5px;
      color: var(--text-2);
      line-height: 1.55;
      max-width: 280px;
      margin-bottom: 28px;
    }

    /* Suggestion cards */
    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }
    .s-card {
      background: var(--bg-card);
      border: 1px solid var(--border-dim);
      border-radius: var(--r-md);
      padding: 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 88px;
      transition: all 0.25s var(--spring);
      position: relative;
      overflow: hidden;
    }
    .s-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--gradient-main);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .s-card:active, .s-card:hover {
      background: var(--bg-elevated);
      border-color: rgba(139, 92, 246, 0.3);
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 8px 24px rgba(139, 92, 246, 0.08);
    }
    .s-card:active::before, .s-card:hover::before { opacity: 1; }
    .s-card .label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-1);
      line-height: 1.4;
    }
    .s-card .icon-wrap {
      align-self: flex-end;
      width: 28px; height: 28px;
      border-radius: 8px;
      background: var(--gradient-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 8px;
    }
    .s-card .icon-wrap i { color: var(--accent-2); }

    /* ═══════════════════════════════════════
       MESSAGE BUBBLES
    ═══════════════════════════════════════ */
    .msg { display: flex; gap: 10px; max-width: 100%; animation: msgIn 0.3s var(--spring); }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg.user { justify-content: flex-end; }

    .bubble-user {
      background: var(--bg-elevated);
      border: 1px solid var(--border-med);
      color: #fff;
      padding: 11px 16px;
      border-radius: 18px 18px 4px 18px;
      font-size: 14px;
      line-height: 1.55;
      max-width: 84%;
      user-select: text;
      word-wrap: break-word;
      position: relative;
    }
    .bubble-user::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: inherit;
      background: var(--gradient-subtle);
      pointer-events: none;
    }

    .ai-icon {
      flex-shrink: 0;
      width: 24px; height: 24px;
      margin-top: 2px;
    }
    .ai-wrap { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .bubble-ai {
      color: var(--text-1);
      font-size: 14px;
      line-height: 1.7;
      user-select: text;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    /* Markdown styling */
    .bubble-ai h1, .bubble-ai h2, .bubble-ai h3 { font-weight: 700; color: #fff; margin: 12px 0 6px; }
    .bubble-ai h1 { font-size: 17px; } .bubble-ai h2 { font-size: 15.5px; } .bubble-ai h3 { font-size: 14.5px; }
    .bubble-ai p { margin-bottom: 8px; } .bubble-ai p:last-child { margin-bottom: 0; }
    .bubble-ai ul, .bubble-ai ol { margin: 8px 0; padding-left: 18px; }
    .bubble-ai li { margin-bottom: 4px; }
    .bubble-ai strong { color: #fff; font-weight: 600; }
    .bubble-ai a { color: var(--accent-4); text-decoration: underline; text-underline-offset: 2px; }
    .bubble-ai blockquote {
      border-left: 3px solid var(--accent-2);
      padding: 6px 12px;
      margin: 10px 0;
      color: var(--text-2);
      font-style: italic;
      background: rgba(168,85,247,0.04);
      border-radius: 0 var(--r-xs) var(--r-xs) 0;
    }
    .bubble-ai code:not(pre code) {
      background: rgba(255,255,255,0.07);
      padding: 2px 7px;
      border-radius: 5px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #c4b5fd;
    }
    .bubble-ai pre {
      margin: 10px 0;
      background: #000 !important;
      border: 1px solid var(--border-dim);
      border-radius: var(--r-sm);
      overflow: hidden;
      position: relative;
    }
    .bubble-ai pre code {
      display: block;
      padding: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      line-height: 1.6;
      color: #e2e8f0;
      overflow-x: auto;
      background: transparent !important;
    }

    .code-copy {
      position: absolute; top: 6px; right: 6px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-dim);
      border-radius: 6px;
      color: var(--text-3);
      padding: 4px 8px;
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      display: flex; align-items: center; gap: 4px;
      transition: all 0.15s;
      z-index: 5;
    }
    .code-copy:hover { background: rgba(255,255,255,0.1); color: #fff; }

    /* Actions */
    .actions { display: flex; gap: 14px; padding-top: 2px; }
    .act-btn {
      background: none; border: none; color: var(--text-4); cursor: pointer;
      display: flex; align-items: center; gap: 4px;
      font-size: 11px; font-family: inherit; transition: color 0.15s;
      padding: 4px 0;
    }
    .act-btn:active, .act-btn:hover { color: var(--text-1); }

    /* Loader */
    .ai-loader { display: inline-flex; gap: 5px; padding: 6px 0; }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--gradient-main);
      animation: dotBounce 1.4s ease-in-out infinite both;
    }
    .dot:nth-child(2) { animation-delay: 0.16s; }
    .dot:nth-child(3) { animation-delay: 0.32s; }
    @keyframes dotBounce {
      0%, 80%, 100% { transform: scale(0.35); opacity: 0.25; }
      40% { transform: scale(1); opacity: 1; }
    }

    .is-typing::after {
      content: '▊';
      animation: caretBlink 1s steps(2,start) infinite;
      color: var(--accent-2);
      margin-left: 1px;
    }
    @keyframes caretBlink { to { visibility: hidden; } }

    /* ═══════════════════════════════════════
       COMPOSER
    ═══════════════════════════════════════ */
    .composer {
      padding: 8px 12px calc(var(--safe-b) + 10px);
      background: linear-gradient(to top, var(--bg-primary) 80%, transparent 100%);
      z-index: 20;
    }
    .compose-bar {
      background: var(--bg-elevated);
      border: 1px solid var(--border-med);
      border-radius: var(--r-xl);
      padding: 5px 6px 5px 6px;
      display: flex;
      align-items: flex-end;
      gap: 4px;
      box-shadow: 0 6px 28px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.02);
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .compose-bar:focus-within {
      border-color: rgba(139, 92, 246, 0.5);
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.15), 0 6px 28px rgba(0,0,0,0.45);
    }

    .c-btn {
      width: 34px; height: 34px; border-radius: 50%;
      background: transparent; border: none;
      color: var(--text-3); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s; flex-shrink: 0;
    }
    .c-btn:active { color: var(--text-1); transform: scale(0.9); }

    .c-input {
      flex: 1;
      background: transparent;
      border: none; outline: none;
      color: var(--text-1);
      font-family: inherit;
      font-size: 14px;
      line-height: 22px;
      max-height: 110px;
      min-height: 22px;
      resize: none;
      padding: 6px 4px;
      user-select: text;
    }
    .c-input::placeholder { color: var(--text-4); }

    .send-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--gradient-main);
      border: none; color: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      transition: all 0.2s var(--spring);
      box-shadow: 0 2px 10px rgba(139, 92, 246, 0.35);
    }
    .send-btn:disabled {
      background: var(--bg-glass-light);
      color: var(--text-4);
      cursor: not-allowed;
      box-shadow: none;
    }
    .send-btn:not(:disabled):active { transform: scale(0.88); }

    /* ═══════════════════════════════════════
       DRAWER
    ═══════════════════════════════════════ */
    .drawer-bg {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      z-index: 50; opacity: 0; pointer-events: none;
      transition: opacity 0.3s var(--spring);
    }
    .drawer-bg.on { opacity: 1; pointer-events: auto; }

    .drawer {
      position: absolute; top: 0; left: 0; bottom: 0;
      width: 82%; max-width: 310px;
      background: var(--bg-card);
      border-right: 1px solid var(--border-dim);
      z-index: 55;
      transform: translateX(-100%);
      transition: transform 0.35s var(--spring);
      display: flex; flex-direction: column;
      padding: calc(var(--safe-t) + 14px) 12px calc(var(--safe-b) + 14px);
    }
    .drawer.on { transform: translateX(0); }

    .drawer-top {
      display: flex; justify-content: space-between; align-items: center;
      padding: 4px 4px 16px;
      border-bottom: 1px solid var(--border-dim);
      margin-bottom: 14px;
    }
    .drawer-logo { display: flex; align-items: center; gap: 8px; }
    .drawer-logo .star-icon { width: 22px; height: 22px; }
    .drawer-logo span { font-weight: 800; font-size: 17px; background: var(--gradient-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

    .new-chat-btn {
      width: 100%; padding: 11px 14px;
      border-radius: var(--r-sm);
      background: var(--gradient-subtle);
      border: 1px solid rgba(139, 92, 246, 0.2);
      color: #c4b5fd;
      display: flex; align-items: center; gap: 8px;
      font-weight: 600; font-size: 13.5px; font-family: inherit;
      cursor: pointer; margin-bottom: 16px;
      transition: all 0.2s;
    }
    .new-chat-btn:active { transform: scale(0.97); background: rgba(139,92,246,0.15); }

    .d-label { font-size: 10px; font-weight: 700; color: var(--text-4); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; padding: 0 4px; }

    .thread-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .thread-list::-webkit-scrollbar { width: 2px; }
    .thread-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.04); }

    .t-item {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 10px; font-size: 13px; color: var(--text-2);
      border-radius: var(--r-xs); cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .t-item:hover { background: rgba(255,255,255,0.03); color: var(--text-1); }
    .t-item.on { background: rgba(139,92,246,0.1); border-color: rgba(139,92,246,0.25); color: #fff; }
    .t-item .t-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .t-item .t-del {
      background: none; border: none; color: var(--text-4);
      cursor: pointer; padding: 3px; border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: all 0.12s;
    }
    .t-item:hover .t-del { opacity: 1; }
    .t-item .t-del:hover { color: #f87171; background: rgba(248,113,113,0.1); }

    .drawer-foot {
      border-top: 1px solid var(--border-dim);
      padding-top: 10px;
      display: flex; flex-direction: column; gap: 2px;
    }
    .d-link {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 10px; font-size: 13px; color: var(--text-3);
      cursor: pointer; border-radius: var(--r-xs);
      border: none; background: none; font-family: inherit; width: 100%;
      transition: all 0.12s;
    }
    .d-link:hover { background: rgba(255,255,255,0.03); color: var(--text-1); }

    /* ═══════════════════════════════════════
       SETTINGS MODAL
    ═══════════════════════════════════════ */
    .s-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      z-index: 80;
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s var(--spring);
    }
    .s-overlay.on { opacity: 1; pointer-events: auto; }

    .s-panel {
      width: 100%; max-width: 340px;
      background: var(--bg-card);
      border: 1px solid var(--border-med);
      border-radius: var(--r-lg);
      padding: 22px;
      display: flex; flex-direction: column; gap: 16px;
      transform: scale(0.9) translateY(14px);
      transition: transform 0.3s var(--spring);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .s-overlay.on .s-panel { transform: scale(1) translateY(0); }

    .s-head { display: flex; align-items: center; justify-content: space-between; }
    .s-head h3 { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 7px; }

    .s-field { display: flex; flex-direction: column; gap: 5px; }
    .s-lbl { font-size: 10px; font-weight: 700; color: var(--text-4); text-transform: uppercase; letter-spacing: 0.5px; }
    .s-inp {
      width: 100%; background: rgba(255,255,255,0.03);
      border: 1px solid var(--border-dim); border-radius: var(--r-xs);
      padding: 9px 12px; outline: none;
      color: var(--text-1); font-family: inherit; font-size: 13px;
      transition: border 0.15s;
    }
    .s-inp:focus { border-color: rgba(139,92,246,0.45); }
    .s-sel {
      width: 100%; background: var(--bg-elevated);
      border: 1px solid var(--border-dim); border-radius: var(--r-xs);
      padding: 9px 12px; outline: none;
      color: var(--text-1); font-family: inherit; font-size: 13px;
      -webkit-appearance: none; cursor: pointer;
    }
    .s-sel:focus { border-color: rgba(139,92,246,0.45); }
    .s-ta {
      width: 100%; background: rgba(255,255,255,0.03);
      border: 1px solid var(--border-dim); border-radius: var(--r-xs);
      padding: 9px 12px; outline: none;
      color: var(--text-1); font-family: inherit; font-size: 13px;
      resize: none; min-height: 56px; line-height: 1.45;
    }
    .s-ta:focus { border-color: rgba(139,92,246,0.45); }
    .range-row { display: flex; justify-content: space-between; align-items: center; }
    .range-val { font-family: 'JetBrains Mono',monospace; font-size: 12px; color: var(--accent-2); font-weight: 600; }
    input[type="range"] { width: 100%; accent-color: var(--accent-2); margin-top: 3px; }

    .s-btns { display: flex; gap: 8px; padding-top: 4px; }
    .btn-cancel {
      flex: 1; padding: 9px; border-radius: var(--r-xs);
      background: rgba(255,255,255,0.04); border: 1px solid var(--border-dim);
      color: var(--text-2); font-weight: 600; font-size: 12.5px;
      cursor: pointer; font-family: inherit; transition: all 0.12s;
    }
    .btn-cancel:hover { background: rgba(255,255,255,0.07); color: #fff; }
    .btn-save {
      flex: 1; padding: 9px; border-radius: var(--r-xs);
      background: var(--gradient-main); border: none;
      color: #fff; font-weight: 700; font-size: 12.5px;
      cursor: pointer; font-family: inherit; transition: all 0.15s;
      box-shadow: 0 3px 12px rgba(139,92,246,0.3);
    }
    .btn-save:active { transform: scale(0.96); }

    /* ═══════════════════════════════════════
       API KEY OVERLAY
    ═══════════════════════════════════════ */
    .key-wall {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      z-index: 35;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
    }
    .key-wall.on { opacity: 1; pointer-events: auto; }

    .key-box {
      background: var(--bg-card);
      border: 1px solid var(--border-med);
      border-radius: var(--r-lg);
      padding: 28px 22px;
      max-width: 320px; width: 100%;
      text-align: center;
      display: flex; flex-direction: column; gap: 14px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .key-icon-wrap {
      width: 50px; height: 50px;
      border-radius: var(--r-sm);
      background: rgba(251,191,36,0.08);
      border: 1px solid rgba(251,191,36,0.2);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto; color: #fbbf24;
    }
    .key-box h3 { font-size: 17px; font-weight: 700; }
    .key-box p { font-size: 13px; color: var(--text-2); line-height: 1.45; }
    .key-inp {
      width: 100%; background: rgba(255,255,255,0.03);
      border: 1px solid var(--border-dim); border-radius: var(--r-sm);
      padding: 11px 14px; outline: none;
      color: var(--text-1); font-family: inherit; font-size: 14px;
      text-align: center;
    }
    .key-inp:focus { border-color: rgba(139,92,246,0.4); }
    .key-btn {
      width: 100%; padding: 12px;
      border-radius: var(--r-sm);
      background: var(--gradient-main); border: none;
      color: #fff; font-weight: 700; font-size: 14px;
      cursor: pointer; font-family: inherit;
      box-shadow: 0 4px 16px rgba(139,92,246,0.3);
      transition: all 0.15s;
    }
    .key-btn:active { transform: scale(0.97); }

    /* ═══════════════════════════════════════
       VOICE OVERLAY
    ═══════════════════════════════════════ */
    #voice {
      position: absolute; inset: 0;
      background: var(--bg-primary);
      z-index: 70;
      display: flex; flex-direction: column;
      justify-content: space-between;
      padding: calc(var(--safe-t) + 16px) 20px calc(var(--safe-b) + 24px);
      opacity: 0; pointer-events: none;
      transition: opacity 0.35s ease;
    }
    #voice.on { opacity: 1; pointer-events: auto; }

    .v-top { display: flex; justify-content: space-between; align-items: center; }
    .v-label { font-size: 13px; font-weight: 600; color: var(--text-3); }

    .v-orb {
      width: 130px; height: 130px;
      border-radius: 50%;
      background: var(--gradient-main);
      box-shadow: 0 0 60px var(--glow-color), 0 0 120px rgba(236,72,153,0.15);
      animation: orbSpin 5s infinite linear;
      margin: auto;
    }
    @keyframes orbSpin {
      0% { transform: scale(1) rotate(0deg); filter: hue-rotate(0deg); }
      50% { transform: scale(1.15) rotate(180deg); filter: hue-rotate(50deg); }
      100% { transform: scale(1) rotate(360deg); filter: hue-rotate(0deg); }
    }

    .v-bottom { display: flex; justify-content: center; gap: 28px; }
    .v-btn {
      width: 52px; height: 52px; border-radius: 50%;
      border: none; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.15s;
    }
    .v-btn:active { transform: scale(0.9); }
    .v-mute { background: var(--bg-elevated); border: 1px solid var(--border-dim) !important; color: var(--text-2); }
    .v-end { background: #ef4444; color: #fff; }

    /* ═══════════════════════════════════════
       ERROR TOAST
    ═══════════════════════════════════════ */
    .toast {
      position: absolute; bottom: 90px; left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.25);
      color: #f87171;
      padding: 9px 16px; border-radius: var(--r-sm);
      font-size: 12.5px; z-index: 40;
      backdrop-filter: blur(8px);
      opacity: 0; pointer-events: none;
      transition: all 0.3s var(--spring);
      max-width: 88%; text-align: center;
    }
    .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  </style>
</head>
<body>

<div id="phone">
  <div class="glow-top"></div>
  <div class="glow-bottom"></div>

  <!-- HEADER -->
  <header class="header">
    <button class="h-btn" id="menuBtn" aria-label="Menu"><i data-lucide="menu" size="19"></i></button>
    <div class="model-pill" id="modelPill">
      <div class="star-icon"></div>
      <span class="model-name" id="modelName">Gemini 2.5 Flash</span>
      <i data-lucide="chevron-down" size="13" style="color:var(--text-3)"></i>
    </div>
    <button class="h-btn" id="newChatBtn" aria-label="New Chat"><i data-lucide="square-pen" size="19"></i></button>
  </header>

  <!-- CHAT -->
  <main class="chat-area" id="chatArea">
    <div class="welcome" id="welcomeView">
      <div class="welcome-star"></div>
      <h1>Hello, Jeet</h1>
      <p>How can I help you with your projects, code, or ideas today?</p>
      <div class="cards">
        <div class="s-card" onclick="sendQuick('Code a responsive navbar in HTML/CSS')">
          <span class="label">Code a responsive navbar</span>
          <div class="icon-wrap"><i data-lucide="code-2" size="14"></i></div>
        </div>
        <div class="s-card" onclick="sendQuick('Explain asynchronous JavaScript & Event Loop')">
          <span class="label">Explain JS Event Loop</span>
          <div class="icon-wrap"><i data-lucide="zap" size="14"></i></div>
        </div>
        <div class="s-card" onclick="sendQuick('Write a high-converting landing page copy')">
          <span class="label">Write landing page copy</span>
          <div class="icon-wrap"><i data-lucide="feather" size="14"></i></div>
        </div>
        <div class="s-card" onclick="sendQuick('Brainstorm 3 game development mechanics')">
          <span class="label">Brainstorm game ideas</span>
          <div class="icon-wrap"><i data-lucide="gamepad-2" size="14"></i></div>
        </div>
      </div>
    </div>
  </main>

  <!-- COMPOSER -->
  <footer class="composer">
    <div class="compose-bar">
      <button class="c-btn" title="Attach"><i data-lucide="image" size="18"></i></button>
      <textarea id="chatInput" class="c-input" placeholder="Message ZoZo AI..." rows="1"></textarea>
      <button class="c-btn" id="voiceBtn" title="Voice"><i data-lucide="mic" size="18"></i></button>
      <button class="send-btn" id="sendBtn" disabled title="Send"><i data-lucide="arrow-up" size="18"></i></button>
    </div>
  </footer>

  <!-- DRAWER -->
  <div class="drawer-bg" id="drawerBg"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-top">
      <div class="drawer-logo">
        <div class="star-icon"></div>
        <span>ZoZo AI</span>
      </div>
      <button class="h-btn" id="closeDrawer"><i data-lucide="x" size="17"></i></button>
    </div>
    <button class="new-chat-btn" onclick="createNewChat()"><i data-lucide="plus" size="16"></i> New Conversation</button>
    <span class="d-label">Recent</span>
    <div class="thread-list" id="threadList"></div>
    <div class="drawer-foot">
      <button class="d-link" onclick="clearAllChats()"><i data-lucide="trash-2" size="15"></i> Clear All Chats</button>
      <button class="d-link" onclick="openSettings()"><i data-lucide="settings" size="15"></i> Settings</button>
    </div>
  </aside>

  <!-- SETTINGS -->
  <div class="s-overlay" id="settingsOv">
    <div class="s-panel">
      <div class="s-head">
        <h3><i data-lucide="sliders" size="15" style="color:var(--accent-2)"></i> Settings</h3>
        <button class="h-btn" id="closeSettings" style="width:30px;height:30px"><i data-lucide="x" size="15"></i></button>
      </div>
      <div class="s-field">
        <label class="s-lbl">API Key</label>
        <input type="password" id="sKey" class="s-inp" placeholder="Enter Gemini API key...">
      </div>
      <div class="s-field">
        <label class="s-lbl">Model</label>
        <select id="sModel" class="s-sel">
          <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
          <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
          <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
          <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
          <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
        </select>
      </div>
      <div class="s-field">
        <label class="s-lbl">System Prompt</label>
        <textarea id="sSys" class="s-ta" rows="2" placeholder="Custom instructions..."></textarea>
      </div>
      <div class="s-field">
        <div class="range-row">
          <label class="s-lbl">Temperature</label>
          <span class="range-val" id="tempVal">0.7</span>
        </div>
        <input type="range" id="sTemp" min="0" max="2" step="0.1" value="0.7">
      </div>
      <div class="s-btns">
        <button class="btn-cancel" onclick="closeSettingsModal()">Cancel</button>
        <button class="btn-save" onclick="saveSettings()">Save</button>
      </div>
    </div>
  </div>

  <!-- API KEY WALL -->
  <div class="key-wall" id="keyWall">
    <div class="key-box">
      <div class="key-icon-wrap"><i data-lucide="key" size="22"></i></div>
      <h3>API Key Required</h3>
      <p>Enter your Gemini API key to start chatting.</p>
      <input type="password" id="keyInput" class="key-inp" placeholder="Paste API key...">
      <button class="key-btn" onclick="saveQuickKey()">Connect ZoZo AI</button>
    </div>
  </div>

  <!-- VOICE -->
  <div id="voice">
    <div class="v-top">
      <button class="h-btn" id="closeVoice"><i data-lucide="chevron-down" size="22"></i></button>
      <span class="v-label">ZoZo Live</span>
      <div style="width:38px"></div>
    </div>
    <div class="v-orb"></div>
    <div class="v-bottom">
      <button class="v-btn v-mute"><i data-lucide="mic-off" size="20"></i></button>
      <button class="v-btn v-end" id="endVoice"><i data-lucide="phone-off" size="20"></i></button>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>
</div>

<script>
// ══════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════
let cfg = {
  apiKey: '',
  model: 'gemini-2.5-flash',
  systemPrompt: 'Aapka naam ZoZo AI hai — duniya ka sabse BEST, sabse SMART AI companion! Hamesha Hinglish mein respond karo. Creator: Jeet Boss.',
  temperature: 0.7
};
let threads = [], activeId = null, busy = false;

const MODELS = {
  'gemini-2.5-flash': 'Gemini 2.5 Flash',
  'gemini-2.5-pro': 'Gemini 2.5 Pro',
  'gemini-2.0-flash': 'Gemini 2.0 Flash',
  'gemini-1.5-flash': 'Gemini 1.5 Flash',
  'gemini-1.5-pro': 'Gemini 1.5 Pro'
};

// DOM
const $ = id => document.getElementById(id);
const chatArea = $('chatArea'), welcome = $('welcomeView'), input = $('chatInput'), sendBtn = $('sendBtn');

// ══════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  loadCfg(); loadThreads(); syncKeyUI(); lucide.createIcons();
});

// ══════════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════════
function loadCfg() {
  const s = localStorage.getItem('zozo_cfg');
  if (s) try { cfg = { ...cfg, ...JSON.parse(s) }; } catch(e) {}
  $('sKey').value = cfg.apiKey;
  $('sModel').value = cfg.model;
  $('sSys').value = cfg.systemPrompt;
  $('sTemp').value = cfg.temperature;
  $('tempVal').textContent = cfg.temperature;
  $('modelName').textContent = MODELS[cfg.model] || 'Gemini AI';
}
function saveCfg() {
  localStorage.setItem('zozo_cfg', JSON.stringify(cfg));
  syncKeyUI();
  $('modelName').textContent = MODELS[cfg.model] || 'Gemini AI';
}
function syncKeyUI() {
  const ok = cfg.apiKey && cfg.apiKey.trim();
  $('keyWall').classList.toggle('on', !ok);
  sendBtn.disabled = busy || !ok || !input.value.trim();
}
function saveQuickKey() {
  const k = $('keyInput').value.trim();
  if (!k) return;
  cfg.apiKey = k; $('sKey').value = k; saveCfg();
}

// ══════════════════════════════════════════
//  THREADS
// ══════════════════════════════════════════
function loadThreads() {
  const s = localStorage.getItem('zozo_threads');
  if (s) try { threads = JSON.parse(s); } catch(e) {}
  if (!threads.length) createNewChat();
  else { activeId = threads[0].id; renderThreads(); renderChat(); }
}
function saveThreads() { localStorage.setItem('zozo_threads', JSON.stringify(threads)); }

function createNewChat() {
  const id = 't_' + Date.now();
  threads.unshift({ id, title: 'New Conversation', messages: [], ts: new Date().toISOString() });
  activeId = id; saveThreads(); renderThreads(); renderChat(); hideDrawer();
  setTimeout(() => input.focus(), 80);
}
function switchThread(id) {
  if (activeId === id || busy) return;
  activeId = id; renderThreads(); renderChat(); hideDrawer();
}
function deleteThread(id, e) {
  e.stopPropagation();
  threads = threads.filter(t => t.id !== id);
  if (activeId === id) activeId = threads.length ? threads[0].id : null;
  if (!threads.length) createNewChat();
  else { saveThreads(); renderThreads(); renderChat(); }
}
function clearAllChats() { threads = []; activeId = null; saveThreads(); createNewChat(); }

function renderThreads() {
  const el = $('threadList'); el.innerHTML = '';
  threads.forEach(t => {
    const d = document.createElement('div');
    d.className = 't-item' + (t.id === activeId ? ' on' : '');
    d.onclick = () => switchThread(t.id);
    d.innerHTML = `<i data-lucide="message-square" size="14" style="flex-shrink:0;color:${t.id===activeId?'var(--accent-2)':'var(--text-4)'}"></i><span class="t-title">${esc(t.title)}</span><button class="t-del" onclick="deleteThread('${t.id}',event)"><i data-lucide="trash-2" size="12"></i></button>`;
    el.appendChild(d);
  });
  lucide.createIcons();
}

// ══════════════════════════════════════════
//  RENDER MESSAGES
// ══════════════════════════════════════════
function renderChat() {
  const t = threads.find(x => x.id === activeId);
  chatArea.querySelectorAll('.msg').forEach(e => e.remove());
  if (!t || !t.messages.length) { welcome.style.display = 'flex'; return; }
  welcome.style.display = 'none';
  t.messages.forEach(m => m.role === 'user' ? addUserMsg(m.text, false) : addAIMsg(m.text, false));
  scroll();
}
function addUserMsg(text, anim = true) {
  const d = document.createElement('div');
  d.className = 'msg user';
  if (!anim) d.style.animation = 'none';
  d.innerHTML = `<div class="bubble-user">${esc(text)}</div>`;
  chatArea.appendChild(d);
}
function addAIMsg(md, anim = true) {
  const d = document.createElement('div');
  d.className = 'msg';
  if (!anim) d.style.animation = 'none';
  d.innerHTML = `<div class="star-icon ai-icon"></div><div class="ai-wrap"><div class="bubble-ai">${marked.parse(md)}</div><div class="actions"><button class="act-btn" onclick="copyMsg(this)"><i data-lucide="copy" size="12"></i> Copy</button><button class="act-btn" onclick="retryLast()"><i data-lucide="rotate-cw" size="12"></i> Retry</button><button class="act-btn"><i data-lucide="thumbs-up" size="12"></i></button><button class="act-btn"><i data-lucide="share-2" size="12"></i></button></div></div>`;
  chatArea.appendChild(d);
  const b = d.querySelector('.bubble-ai');
  Prism.highlightAllUnder(b); addCodeCopy(b); lucide.createIcons();
}
function addCodeCopy(el) {
  el.querySelectorAll('pre').forEach(pre => {
    if (pre.querySelector('.code-copy')) return;
    pre.style.position = 'relative';
    const btn = document.createElement('button');
    btn.className = 'code-copy';
    btn.innerHTML = `<i data-lucide="copy" size="10"></i> Copy`;
    btn.onclick = () => {
      const c = pre.querySelector('code');
      if (c) { navigator.clipboard.writeText(c.innerText); btn.innerHTML = `<i data-lucide="check" size="10"></i> Done`; lucide.createIcons(); setTimeout(() => { btn.innerHTML = `<i data-lucide="copy" size="10"></i> Copy`; lucide.createIcons(); }, 1800); }
    };
    pre.appendChild(btn);
  });
  lucide.createIcons();
}

// ══════════════════════════════════════════
//  SEND & STREAM
// ══════════════════════════════════════════
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 110) + 'px';
  syncKeyUI();
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); trySend(); }
});
sendBtn.addEventListener('click', trySend);

function trySend() {
  const v = input.value.trim();
  if (v && !sendBtn.disabled) executeSend(v);
}
function sendQuick(txt) {
  if (!cfg.apiKey || !cfg.apiKey.trim()) { $('keyWall').classList.add('on'); return; }
  executeSend(txt);
}

async function executeSend(text) {
  if (busy) return;
  if (!cfg.apiKey || !cfg.apiKey.trim()) { $('keyWall').classList.add('on'); return; }
  const t = threads.find(x => x.id === activeId);
  if (!t) return;

  welcome.style.display = 'none';
  addUserMsg(text);
  input.value = ''; input.style.height = 'auto';
  sendBtn.disabled = true; busy = true;

  t.messages.push({ role: 'user', text });
  if (t.title === 'New Conversation') {
    t.title = text.length > 26 ? text.slice(0, 23) + '...' : text;
    renderThreads();
  }
  saveThreads(); scroll();

  // Loader dots
  const ld = document.createElement('div');
  ld.className = 'msg';
  ld.innerHTML = `<div class="star-icon ai-icon"></div><div class="ai-loader"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  chatArea.appendChild(ld); scroll();

  try {
    const contents = t.messages.map(m => ({ role: m.role === 'user' ? 'user' : 'model', parts: [{ text: m.text }] }));
    const body = { contents, generationConfig: { temperature: +cfg.temperature } };
    if (cfg.systemPrompt && cfg.systemPrompt.trim()) body.systemInstruction = { parts: [{ text: cfg.systemPrompt }] };

    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${cfg.model}:streamGenerateContent?key=${cfg.apiKey}&alt=sse`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    });
    if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error?.message || `HTTP ${res.status}`); }

    ld.remove();

    const sr = document.createElement('div');
    sr.className = 'msg';
    sr.innerHTML = `<div class="star-icon ai-icon"></div><div class="ai-wrap"><div class="bubble-ai is-typing" id="stream"></div></div>`;
    chatArea.appendChild(sr); scroll();

    const dest = $('stream');
    let acc = '', buf = '';
    const reader = res.body.getReader(), dec = new TextDecoder();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const l of lines) {
        const tr = l.trim();
        if (tr.startsWith('data: ')) {
          try {
            const p = JSON.parse(tr.slice(6));
            const chunk = p.candidates?.[0]?.content?.parts?.[0]?.text || '';
            if (chunk) { acc += chunk; dest.innerHTML = marked.parse(acc); Prism.highlightAllUnder(dest); scroll(); }
          } catch(e) {}
        }
      }
    }

    dest.classList.remove('is-typing'); dest.removeAttribute('id');
    const acts = document.createElement('div');
    acts.className = 'actions';
    acts.innerHTML = `<button class="act-btn" onclick="copyMsg(this)"><i data-lucide="copy" size="12"></i> Copy</button><button class="act-btn" onclick="retryLast()"><i data-lucide="rotate-cw" size="12"></i> Retry</button><button class="act-btn"><i data-lucide="thumbs-up" size="12"></i></button><button class="act-btn"><i data-lucide="share-2" size="12"></i></button>`;
    sr.querySelector('.ai-wrap').appendChild(acts);
    addCodeCopy(dest); lucide.createIcons();
    t.messages.push({ role: 'model', text: acc }); saveThreads();
  } catch (err) {
    ld.remove(); showToast(err.message); console.error(err);
  } finally {
    busy = false; syncKeyUI();
  }
}

function retryLast() {
  const t = threads.find(x => x.id === activeId);
  if (!t || t.messages.length < 2 || busy) return;
  if (t.messages.at(-1).role === 'model') t.messages.pop();
  const last = t.messages.at(-1);
  if (last?.role === 'user') { t.messages.pop(); saveThreads(); renderChat(); executeSend(last.text); }
}

// ══════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════
function scroll() { chatArea.scrollTop = chatArea.scrollHeight; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function copyMsg(btn) {
  const t = btn.closest('.ai-wrap').querySelector('.bubble-ai').innerText;
  navigator.clipboard.writeText(t);
  btn.innerHTML = `<i data-lucide="check" size="12"></i> Copied`; lucide.createIcons();
  setTimeout(() => { btn.innerHTML = `<i data-lucide="copy" size="12"></i> Copy`; lucide.createIcons(); }, 1800);
}
function showToast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 3500); }

// ══════════════════════════════════════════
//  DRAWER
// ══════════════════════════════════════════
function showDrawer() { $('drawerBg').classList.add('on'); $('drawer').classList.add('on'); }
function hideDrawer() { $('drawerBg').classList.remove('on'); $('drawer').classList.remove('on'); }
$('menuBtn').onclick = showDrawer;
$('closeDrawer').onclick = hideDrawer;
$('drawerBg').onclick = hideDrawer;
$('newChatBtn').onclick = createNewChat;

// ══════════════════════════════════════════
//  SETTINGS
// ══════════════════════════════════════════
function openSettings() {
  hideDrawer();
  $('sKey').value = cfg.apiKey; $('sModel').value = cfg.model;
  $('sSys').value = cfg.systemPrompt; $('sTemp').value = cfg.temperature;
  $('tempVal').textContent = cfg.temperature;
  $('settingsOv').classList.add('on');
}
function closeSettingsModal() { $('settingsOv').classList.remove('on'); }
$('closeSettings').onclick = closeSettingsModal;
$('settingsOv').addEventListener('click', e => { if (e.target === $('settingsOv')) closeSettingsModal(); });
$('sTemp').addEventListener('input', function() { $('tempVal').textContent = this.value; });

function saveSettings() {
  cfg.apiKey = $('sKey').value.trim();
  cfg.model = $('sModel').value;
  cfg.systemPrompt = $('sSys').value.trim();
  cfg.temperature = +$('sTemp').value;
  saveCfg(); closeSettingsModal();
}

// ══════════════════════════════════════════
//  VOICE
// ══════════════════════════════════════════
$('voiceBtn').onclick = () => $('voice').classList.add('on');
$('closeVoice').onclick = () => $('voice').classList.remove('on');
$('endVoice').onclick = () => $('voice').classList.remove('on');

// ══════════════════════════════════════════
//  MODEL CYCLE
// ══════════════════════════════════════════
const mKeys = Object.keys(MODELS);
$('modelPill').onclick = () => {
  let i = mKeys.indexOf(cfg.model);
  i = (i + 1) % mKeys.length;
  cfg.model = mKeys[i];
  $('modelName').textContent = MODELS[cfg.model];
  $('sModel').value = cfg.model;
  saveCfg();
};

lucide.createIcons();
</script>
</body>
</html>
